<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ELLIA PARIS — Coque iPhone</title>
<style>
:root{color-scheme:light;--case:#141414;--edge:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:Georgia,serif;
  background:radial-gradient(ellipse 80% 60% at 50% 30%,#26251f 0%,#100f0d 60%,#070706 100%)}
.marque{position:fixed;top:20px;left:0;right:0;text-align:center;color:#e8e4da;letter-spacing:.42em;
  font-size:13px;text-transform:uppercase;opacity:.9;z-index:10}
.marque small{display:block;font-size:8.5px;letter-spacing:.28em;opacity:.5;margin-top:6px;font-family:Arial,sans-serif}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  perspective:1400px;perspective-origin:50% 45%;cursor:grab;touch-action:none}
.stage:active{cursor:grabbing}
/* Ombre portee au sol */
.floor{position:absolute;top:62%;left:50%;width:230px;height:44px;transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);filter:blur(9px)}
.phone{position:relative;width:230px;height:470px;transform-style:preserve-3d;
  transform:rotateY(0deg);will-change:transform}
.phone.spin{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.face{position:absolute;inset:0;border-radius:38px;backface-visibility:hidden;overflow:hidden}
/* DOS : couleur de la coque + gravure */
.back{background:
  radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.10),transparent 45%),
  linear-gradient(155deg,var(--edge),var(--case) 40%,#0c0c0c);
  transform:translateZ(6px);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06),inset 0 2px 6px rgba(255,255,255,.05)}
/* FACE ecran (glossy noir) */
.front{background:linear-gradient(160deg,#1a1a1c,#050506);transform:translateZ(-6px) rotateY(180deg);
  box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.screen{position:absolute;inset:10px;border-radius:30px;background:linear-gradient(150deg,#0a0a0d,#000);
  box-shadow:inset 0 0 0 2px #000}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:64px;height:15px;
  background:#000;border-radius:10px}
/* Tranche (epaisseur) */
.rim{position:absolute;border-radius:38px}
.rim.l{left:-6px;top:0;width:12px;height:100%;background:linear-gradient(90deg,#000,var(--edge));
  transform:rotateY(-90deg) translateZ(115px)}
.rim.r{right:-6px;top:0;width:12px;height:100%;background:linear-gradient(90deg,var(--edge),#000);
  transform:rotateY(90deg) translateZ(115px)}
/* Ilot camera en haut a gauche du dos */
.cam{position:absolute;top:20px;left:20px;width:82px;height:82px;border-radius:22px;
  background:linear-gradient(150deg,#1e1e1e,#0a0a0a);transform:translateZ(11px);
  box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.08)}
.lens{position:absolute;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#3a4258,#05060a 62%);
  box-shadow:0 0 0 3px #0b0b0b,inset 0 0 5px rgba(0,0,0,.9)}
.lens::after{content:"";position:absolute;top:6px;left:8px;width:7px;height:5px;border-radius:50%;
  background:rgba(160,190,255,.5);filter:blur(1px)}
.l1{top:9px;left:9px}.l2{top:9px;right:9px}.l3{bottom:9px;left:26px}
.flash{position:absolute;top:34px;right:-16px;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle,#f6eccf,#8a7d55);transform:translateZ(11px)}

<body>
<div class="marque">ELLIA PARIS<small>Coque iPhone — rendu de gravure</small></div>
<div class="stage" id="stage">
  <div class="floor"></div>
  <div class="phone spin" id="phone">
    <div class="face back">
      <div class="cam">
        <div class="lens l1"></div><div class="lens l2"></div><div class="lens l3"></div>
      </div>
      <div class="flash"></div>
      <div class="grav"></div>
    </div>
    <div class="face front"><div class="screen"><div class="notch"></div></div></div>
    <div class="rim l"></div><div class="rim r"></div>
  </div>
</div>
<div class="ui">
  <div class="hint">Glissez pour tourner</div>
  <div class="row">
    <button id="bNoir" class="on">Noir mat</button>
    <button id="bGris">Gris anthracite</button>
    <button id="bSpin" class="on">Rotation auto</button>
  </div>
</div>
<script>
var phone=document.getElementById('phone'),stage=document.getElementById('stage');
var rot=0,drag=false,px=0,spin=true;
function apply(){phone.style.transform='rotateY('+rot+'deg)';}
stage.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;spin=false;phone.classList.remove('spin');
  var m=phone.style.transform.match(/-?[\d.]+/);rot=m?parseFloat(m[0]):rot;document.getElementById('bSpin').classList.remove('on');});
addEventListener('pointermove',function(e){if(!drag)return;rot+=(e.clientX-px)*0.6;px=e.clientX;apply();});
addEventListener('pointerup',function(){drag=false;});
document.getElementById('bNoir').onclick=function(){setC('#141414','#2a2a2a','bNoir','bGris');};
document.getElementById('bGris').onclick=function(){setC('#3b3e41','#54585c','bGris','bNoir');};
function setC(c,e,on,off){document.documentElement.style.setProperty('--case',c);
  document.documentElement.style.setProperty('--edge',e);
  document.getElementById(on).classList.add('on');document.getElementById(off).classList.remove('on');}
document.getElementById('bSpin').onclick=function(e){spin=!spin;if(spin){phone.style.transform='';phone.classList.add('spin');e.target.classList.add('on');}else{phone.classList.remove('spin');apply();e.target.classList.remove('on');}};
</script></body></html>
