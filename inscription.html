<section class="page-hero page-top"><div class="wrap"><div class="eyebrow">Le Cercle ELLIA</div><h1>Créer un compte</h1></div></section>

<section class="pad" style="padding-top:30px"><div class="authwrap">
  <div class="field"><label>Nom complet</label><input id="nom" autocomplete="name"></div>
  <div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div>
  <div class="field"><label>Mot de passe</label><input id="pw" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></div>
  <button class="btn solid" id="go" style="width:100%;text-align:center">Créer mon compte</button>
  <div class="authmsg" id="msg"></div>
  <div class="auth-alt">Déjà un compte ? <a href="connexion.html">Se connecter</a></div>
</div></section>

<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 ELLIA PARIS</span><span><a href="mentions.html">Mentions légales</a> · <a href="cgv.html">CGV</a> · <a href="confidentialite.html">Confidentialité</a></span></div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js?v=16"></script>
<script src="cart.js?v=16"></script>
<script>
document.getElementById('go').addEventListener('click', async ()=>{
  const msg=document.getElementById('msg'); msg.className='authmsg'; msg.textContent='';
  const nom=document.getElementById('nom').value.trim();
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  if(!nom||!email||pw.length<8){ msg.className='authmsg err'; msg.textContent='Remplis ton nom, ton e-mail et un mot de passe de 8 caractères minimum.'; return; }
  const { error } = await SB.auth.signUp({ email, password:pw, options:{ data:{ nom }, emailRedirectTo: location.origin + '/connexion.html' } });
  if(error){ msg.className='authmsg err'; msg.textContent='Erreur : '+error.message; return; }
  msg.className='authmsg ok'; msg.textContent='Compte créé ! Vérifie ta boîte mail et clique sur le lien de confirmation pour activer ton compte.';
});
</script>
