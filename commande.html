<style>
  .cmd{max-width:760px;margin:0 auto;padding:0 24px}
  .cmd-back{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gris-txt)}
  .cmd-back:hover{color:var(--noir)}
  .cmd-title{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
  .cmd-title h1{font-size:clamp(30px,5vw,46px)}
  .cmd-amount{font-family:var(--serif);font-size:28px}
  /* Stepper */
  .stepper{display:flex;margin:38px 0 30px}
  .step{flex:1;text-align:center;position:relative}
  .step .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--ligne);background:#fff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gris-txt);position:relative;z-index:2}
  .step.done .dot,.step.current .dot{background:var(--noir);border-color:var(--noir);color:#fff}
  .step .lbl{font-size:11.5px;letter-spacing:.06em;color:var(--gris-txt)}
  .step.done .lbl,.step.current .lbl{color:var(--noir);font-weight:500}
  .step::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:2px;background:var(--ligne);z-index:1}
  .step:first-child::before{display:none}
  .step.done::before,.step.current::before{background:var(--noir)}
  .cmd-status-line{text-align:center;font-family:var(--serif);font-size:20px;margin-bottom:30px}
  .cmd-card{border:1px solid var(--ligne);padding:26px 28px;margin-bottom:18px}
  .cmd-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--ligne-soft);font-size:14.5px}
  .cmd-row:last-child{border-bottom:none}
  .cmd-row .k{color:var(--gris-txt)}
  .cmd-row .v{text-align:right;color:var(--noir)}
  .cancelled{background:#f6e9e6;border:1px solid #e3c4bd;color:#8a3b2c;padding:16px 18px;text-align:center;margin:30px 0}
</style>

<script>
(async function(){
  const box = document.getElementById('content');
  // Le service d'authentification n'a pas chargé : message clair plutôt qu'un écran figé
  if(typeof SB === 'undefined' || !SB || !SB.auth){
    box.innerHTML='<p style="margin-top:30px">Service temporairement indisponible. <a href="#" onclick="location.reload();return false" style="text-decoration:underline">Réessayer</a></p>';
    return;
  }
  let session = null;
  try { const r = await SB.auth.getSession(); session = r && r.data ? r.data.session : null; } catch(_){}
  // PAS de redirection si non connecté : un client SANS COMPTE doit pouvoir
  // suivre sa commande (formulaire numéro + e-mail plus bas).
  const numero = new URLSearchParams(location.search).get('n');
  if(!numero){ box.innerHTML='<p style="margin-top:30px">Commande introuvable. <a href="compte.html" style="text-decoration:underline">Retour</a></p>'; return; }
  const eur=n=>Number(n||0).toLocaleString('fr-FR')+' €';
  const norm=s=>(s||'').toLowerCase().split('é').join('e').split('è').join('e').split('ê').join('e').split('à').join('a');
  function statusIndex(s){ s=norm(s);
    if(s.includes('annul'))return -1;
    if(s.includes('livr'))return 3;
    // ATTENTION a l'ordre : "prete a expedier" contient "exped". Sans ce test
    // en premier, une commande encore a l'atelier s'affichait "Expédiée".
    if(s.startsWith('prete'))return 1;
    if(s.includes('exped'))return 2;
    if(s.includes('prep'))return 1;
    return 0; }
  function trackUrl(t,n){ if(!n) return ''; t=(t||'').toLowerCase(); n=encodeURIComponent(n);
    if(t.includes('colissimo')||t.includes('poste')) return 'https://www.laposte.fr/outils/suivre-vos-envois?code='+n;
    if(t.includes('chrono')) return 'https://www.chronopost.fr/tracking-no-cms/suivi-page?listeNumerosLT='+n;
    if(t.includes('ups')) return 'https://www.ups.com/track?tracknum='+n;
    if(t.includes('dhl')) return 'https://www.dhl.com/fr-fr/home/tracking.html?tracking-id='+n;
    if(t.includes('mondial')) return 'https://www.mondialrelay.fr/suivi-de-colis/?NumeroExpedition='+n; return ''; }

  // 1) Client connecté : lecture directe (protégée par RLS = ses commandes uniquement)
  let o = null, viaLookup = false;
  if (session) {
    try {
      const { data } = await SB.from('orders')
        .select('numero,created_at,statut,suivi,transporteur,initiales,finition,emplacement,montant_total,adresse_livraison,cp_livraison,ville_livraison,pays_livraison')
        .eq('numero',numero).maybeSingle();
      o = data || null;
    } catch(_){}
  }

  // 2) Achat SANS COMPTE : on demande l'e-mail de la commande pour l'identifier
  if(!o){
    box.innerHTML =
      '<div style="max-width:420px;margin:30px auto 0">'+
        '<h1 style="font-family:var(--serif);font-size:28px;margin-bottom:8px">Suivre ma commande</h1>'+
        '<p style="color:var(--gris-txt);font-size:13.5px;margin-bottom:20px">'+
          (session ? 'Cette commande n’est pas rattachée à votre compte. Saisissez l’e-mail utilisé lors de l’achat pour l’afficher.' :
           'Commande <b>'+String(numero).replace(/[<>&]/g,'')+'</b>. Saisissez l’e-mail utilisé lors de l’achat pour afficher son suivi.')+'</p>'+
        '<form id="lookupForm">'+
          '<input id="lkEmail" type="email" inputmode="email" autocomplete="email" placeholder="votre@email.com" style="width:100%;background:#fff;border:1px solid var(--ligne);padding:13px 14px;font-family:var(--sans);font-size:15px;outline:none;border-radius:7px">'+
          '<button class="btn solid" type="submit" id="lkGo" style="width:100%;text-align:center;margin-top:12px">Afficher ma commande</button>'+
        '</form>'+
        '<div id="lkMsg" role="alert" aria-live="polite" style="font-size:13px;margin-top:12px;color:#b1432f"></div>'+
        '<p style="font-size:12.5px;color:var(--gris-txt);margin-top:18px">Vous avez un compte ? <a href="connexion.html?retour='+encodeURIComponent('commande.html?n='+numero)+'" style="color:var(--noir);text-decoration:underline">Connectez-vous</a></p>'+
      '</div>';
    o = await new Promise(resolve => {
      document.getElementById('lookupForm').addEventListener('submit', async (ev)=>{
        ev.preventDefault();
        const em = document.getElementById('lkEmail').value.trim();
        const m = document.getElementById('lkMsg'); const b = document.getElementById('lkGo');
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ m.textContent='Merci de saisir une adresse e-mail valide.'; return; }
        m.textContent=''; b.disabled=true; b.textContent='Recherche…';
        try{
          const r = await fetch('/api/order-lookup',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ numero, email:em }) });
          const j = await r.json();
          if(j.ok && j.order){ viaLookup = true; resolve(j.order); return; }
          // Messages distincts : ne pas dire "commande introuvable" si c'est une panne
          if(j.error==='rate') m.textContent='Trop de tentatives. Patientez une minute avant de réessayer.';
          else if(j.error==='db' || j.error==='no_db') m.textContent='Service momentanément indisponible. Réessayez dans quelques instants.';
          else m.textContent = 'Aucune commande ne correspond à ce numéro et cet e-mail. Vérifiez l’e-mail utilisé lors de l’achat.';
        }catch(_){ m.textContent='Connexion impossible. Réessayez dans un instant.'; }
        b.disabled=false; b.textContent='Afficher ma commande';
      });
    });
  }

  const idx = statusIndex(o.statut);
  const STEPS=['Reçue','En préparation','Expédiée','Livrée'];
  const SENT={ '-1':'Cette commande a été annulée.','0':'Votre commande a bien été reçue.','1':'Votre commande est en préparation dans nos ateliers.','2':'Votre commande a été expédiée — elle est en route vers vous.','3':'Votre commande a été livrée.' };
  let stepper='';
  if(idx===-1){
    stepper='<div class="cancelled">Commande annulée</div>';
  } else {
    stepper='<div class="stepper">'+STEPS.map((l,i)=>{
      const cls = i<idx?'done': (i===idx?'current':'');
      return '<div class="step '+cls+'"><div class="dot">'+(i<idx||i===idx?'✓':(i+1))+'</div><div class="lbl">'+l+'</div></div>';
    }).join('')+'</div>';
  }

  function escq(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  const gravure = (o.initiales) ? (escq(o.initiales)+' · '+escq(o.finition||'')+(o.emplacement?(' · '+escq(o.emplacement)):'')) : 'Sans gravure';
  const adr = [o.adresse_livraison,((o.cp_livraison||'')+' '+(o.ville_livraison||'')).trim(),o.pays_livraison].filter(x=>x&&String(x).trim()).join(', ');
  const url = trackUrl(o.transporteur,o.suivi);
  let suiviBlock='';
  if(o.suivi){
    suiviBlock='<div class="cmd-card"><div class="cmd-row"><span class="k">Transporteur</span><span class="v">'+(o.transporteur||'—')+'</span></div>'+
      '<div class="cmd-row"><span class="k">Numéro de suivi</span><span class="v">'+escq(o.suivi)+'</span></div></div>'+
      (url?('<a href="'+url+'" target="_blank" rel="noopener" class="btn solid" style="display:block;text-align:center">Suivre ma livraison →</a>'):'');
  }

  box.innerHTML =
    '<div class="cmd-title"><h1>Commande '+escq(o.numero)+'</h1><span class="cmd-amount">'+eur(o.montant_total)+'</span></div>'+
    '<p style="color:var(--gris-txt);font-size:13px">Passée le '+ (function(d){ if(!d) return '—'; const t=new Date(d); return isNaN(t)?String(d).slice(0,10):t.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); })(o.created_at) +'</p>'+
    stepper+
    (idx>=0?('<p class="cmd-status-line">'+SENT[String(idx)]+'</p>'):'')+
    '<div class="cmd-card">'+
      '<div class="cmd-row"><span class="k">Article</span><span class="v">La Pochette ELLIA — Noir</span></div>'+
      '<div class="cmd-row"><span class="k">Personnalisation</span><span class="v">'+gravure+'</span></div>'+
      '<div class="cmd-row"><span class="k">Livraison</span><span class="v">'+escq(adr||'—')+'</span></div>'+
      '<div class="cmd-row"><span class="k">Total</span><span class="v" style="font-family:var(--serif);font-size:18px">'+eur(o.montant_total)+'</span></div>'+
    '</div>'+
    suiviBlock +
    // La facture exige une session : on ne propose pas un lien qui renverrait au login
    (viaLookup ? '<p style="font-size:12.5px;color:var(--gris-txt);margin-top:16px;text-align:center">Votre facture vous a été envoyée par e-mail. Besoin d’un nouvel envoi ? <a href="contact.html" style="color:var(--noir);text-decoration:underline">Écrivez-nous</a>.</p>'
               : '<a href="facture.html?n='+encodeURIComponent(o.numero)+'" class="btn" style="display:block;text-align:center;margin-top:14px">Télécharger la facture</a>');
})();
</script>
