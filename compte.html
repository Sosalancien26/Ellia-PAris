<section class="page-hero page-top"><div class="wrap"><div class="eyebrow">Espace client</div><h1>Mon compte</h1><p id="hello"></p></div></section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="cart.js"></script>
<script>
(async function(){
  const { data:{ session } } = await SB.auth.getSession();
  if(!session){ location.href='connexion.html'; return; }
  const user=session.user;
  document.getElementById('hello').textContent = (user.user_metadata && user.user_metadata.nom ? user.user_metadata.nom+' — ' : '') + user.email;
  const eur=n=>Number(n).toLocaleString('fr-FR')+' €';
  const { data:orders, error } = await SB.from('orders').select('numero,created_at,initiales,finition,montant_total,statut').order('created_at',{ascending:false});
  const box=document.getElementById('orders');
  if(error){ box.innerHTML='<p style="color:#b1432f">Erreur de chargement : '+error.message+'</p>'; return; }
  if(!orders || !orders.length){ box.innerHTML='<p style="color:var(--gris-txt)">Aucune commande pour le moment. <a href="pochette.html" style="color:var(--noir);text-decoration:underline">Découvrir la pochette</a></p>'; return; }
  box.innerHTML=orders.map(o=>'<div class="order-card"><div><div class="oid">'+o.numero+'</div><div class="meta">'+(o.created_at||'').slice(0,10)+(o.initiales?(' · Gravure '+o.initiales+' ('+o.finition+')'):'')+'</div></div><div style="text-align:right"><div class="oid">'+eur(o.montant_total)+'</div><div class="st">'+o.statut+'</div></div></div>').join('');
})();
document.getElementById('logout').addEventListener('click', async ()=>{ await SB.auth.signOut(); location.href='index.html'; });
</script>
</body>
</html>
