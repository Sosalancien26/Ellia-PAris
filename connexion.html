<section id="contenu" class="page-hero page-top"><div class="wrap"><div class="eyebrow">Le Cercle ELLIA</div><h1>Connexion</h1></div></section>

<section class="pad" style="padding-top:30px"><div class="authwrap">
  <form id="loginForm" novalidate>
  <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email"></div>
  <div class="field"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn solid" id="go" type="submit" style="width:100%;text-align:center">Se connecter</button>
  </form>
  <div class="authmsg" id="msg" role="alert" aria-live="polite"></div>
  <div class="auth-alt"><a href="#" id="forgot">Mot de passe oublié ?</a></div>
  <div class="auth-alt">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></div>

  <div id="resetBox" style="display:none;margin-top:10px;padding-top:18px;border-top:1px solid var(--ligne)">
    <div class="field"><label for="newpw">Nouveau mot de passe</label><input id="newpw" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></div>
    <button class="btn solid" id="doReset" style="width:100%;text-align:center">Définir mon nouveau mot de passe</button>
    <div class="authmsg" id="rmsg"></div>
  </div>
</div></section>

<script>
/* Lien de confirmation / réinitialisation expiré : Supabase renvoie l'erreur dans le hash */
(function(){
  const h = location.hash || '';
  if(h.includes('error')){
    const m = document.getElementById('msg');
    m.className = 'authmsg err';
    m.innerHTML = h.includes('expired') || h.includes('invalid')
      ? 'Ce lien a expiré ou a déjà été utilisé. Demandez-en un nouveau ci-dessous ("Mot de passe oublié ?") ou réessayez de vous connecter.'
      : 'Le lien n’a pas pu être validé. Réessayez ou écrivez-nous à contact@ellia-paris.fr.';
    history.replaceState(null,'',location.pathname);
  }
  if(new URLSearchParams(location.search).get('expired')==='1'){
    const m = document.getElementById('msg');
    m.className='authmsg'; m.textContent='Votre session a expiré. Merci de vous reconnecter.';
  }
})();
function frLogin(e){
  const m = String(e && e.message || '').toLowerCase();
  if(m.includes('email not confirmed')) return 'CONFIRM';
  if(m.includes('invalid login credentials')) return 'E-mail ou mot de passe incorrect.';
  if(m.includes('too many') || m.includes('rate limit')) return 'Trop de tentatives. Patientez une minute avant de réessayer.';
  if(m.includes('failed to fetch') || m.includes('network')) return 'Connexion impossible. Vérifiez votre connexion internet.';
  return 'Connexion impossible. Réessayez ou écrivez-nous à contact@ellia-paris.fr.';
}
document.getElementById('loginForm').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const msg=document.getElementById('msg'); const btn=document.getElementById('go');
  msg.className='authmsg'; msg.textContent='';
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  if(!email||!pw){ msg.className='authmsg err'; msg.textContent='Merci de saisir votre e-mail et votre mot de passe.'; return; }
  const oldTxt=btn.textContent; btn.disabled=true; btn.textContent='Connexion…';
  try{
    const { error } = await SB.auth.signInWithPassword({ email, password:pw });
    if(error){
      const fr = frLogin(error);
      msg.className='authmsg err';
      if(fr==='CONFIRM'){
        // Compte jamais confirmé : on propose de renvoyer l'e-mail (sinon impasse totale)
        msg.innerHTML = 'Votre compte n’est pas encore confirmé. <a href="#" id="resendLink" style="color:inherit;text-decoration:underline">Renvoyer l’e-mail de confirmation</a>';
        document.getElementById('resendLink').addEventListener('click', async (e2)=>{
          e2.preventDefault();
          msg.className='authmsg'; msg.textContent='Envoi en cours…';
          try{
            await SB.auth.resend({ type:'signup', email, options:{ emailRedirectTo: location.origin + '/connexion.html' } });
            msg.className='authmsg ok'; msg.textContent='E-mail de confirmation renvoyé. Vérifiez votre boîte (et vos spams).';
          }catch(_){ msg.className='authmsg err'; msg.textContent='Envoi impossible pour le moment. Écrivez-nous à contact@ellia-paris.fr.'; }
        });
      } else { msg.textContent = fr; }
      return;
    }
    // Retour à la page d'origine si on venait d'ailleurs (ex : suivi de commande)
    const back = new URLSearchParams(location.search).get('retour');
    location.href = (back && /^[a-z0-9._-]+\.html(\?.*)?$/i.test(back)) ? back : 'compte.html';
  }catch(e){
    msg.className='authmsg err'; msg.textContent=frLogin(e);
  }finally{
    btn.disabled=false; btn.textContent=oldTxt;
  }
});
document.getElementById('forgot').addEventListener('click', async (e)=>{
  e.preventDefault();
  const msg=document.getElementById('msg'); const email=document.getElementById('email').value.trim();
  if(!email){ msg.className='authmsg err'; msg.textContent='Entre d\'abord ton e-mail ci-dessus.'; return; }
  msg.className='authmsg'; msg.textContent='Envoi en cours…';
  // Envoi via NOTRE serveur (SMTP fiable) au lieu de l'email Supabase
  try{
    await fetch('/api/auth/reset',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email }) });
  }catch(_){}
  msg.className='authmsg ok';
  msg.textContent='Si un compte existe, un e-mail de réinitialisation vient d\'être envoyé. Pense à vérifier tes spams.';
});
/* Réinitialisation : quand l'utilisateur arrive via le lien reçu par e-mail */
SB.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){
    document.getElementById('resetBox').style.display='block';
    const m=document.getElementById('msg'); m.className='authmsg ok'; m.textContent='Choisissez votre nouveau mot de passe ci-dessous.';
    document.getElementById('newpw').focus();
  }
});
document.getElementById('doReset').addEventListener('click', async ()=>{
  const rmsg=document.getElementById('rmsg'); rmsg.className='authmsg'; rmsg.textContent='';
  const pw=document.getElementById('newpw').value;
  if(pw.length<8){ rmsg.className='authmsg err'; rmsg.textContent='8 caractères minimum.'; return; }
  const { error } = await SB.auth.updateUser({ password:pw });
  if(error){ rmsg.className='authmsg err'; rmsg.textContent='Erreur : '+error.message; return; }
  rmsg.className='authmsg ok'; rmsg.textContent='Mot de passe mis à jour ✓ Redirection…';
  setTimeout(()=>location.href='compte.html',1200);
});
</script>
