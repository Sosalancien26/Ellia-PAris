<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />

<meta name="description" content="Connectez-vous à votre compte ELLIA PARIS." />
<meta name="robots" content="noindex,nofollow" />
</head>
<body>

<header id="header" class="solid">
  <div class="bar">
    <a href="index.html"><img class="nav-logo" src="assets/logo_black_trim.png" alt="ELLIA PARIS" /></a>
    <nav class="links"><a href="index.html">Accueil</a><a href="pochette.html">La Pochette</a><a href="personnalisation.html">Personnalisation</a><a href="maison.html">Maison</a></nav>
    <div class="nav-right"><a href="compte.html" class="nav-ico account">Compte</a><a href="panier.html" class="nav-ico" data-cart-count>Panier (0)</a><button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button></div>
  </div>
</header>
<div class="mobile-menu" id="mobileMenu"><a href="index.html">Accueil</a><a href="pochette.html">La Pochette</a><a href="personnalisation.html">Personnalisation</a><a href="maison.html">Maison</a><a href="compte.html">Compte</a></div>

<section class="page-hero page-top"><div class="wrap"><div class="eyebrow">Le Cercle ELLIA</div><h1>Connexion</h1></div></section>

<section class="pad" style="padding-top:30px"><div class="authwrap">
  <div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div>
  <div class="field"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn solid" id="go" style="width:100%;text-align:center">Se connecter</button>
  <div class="authmsg" id="msg"></div>
  <div class="auth-alt"><a href="#" id="forgot">Mot de passe oublié ?</a></div>
  <div class="auth-alt">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></div>

  <div id="resetBox" style="display:none;margin-top:10px;padding-top:18px;border-top:1px solid var(--ligne)">
    <div class="field"><label>Nouveau mot de passe</label><input id="newpw" type="password" autocomplete="new-password" placeholder="8 caractères minimum"></div>
    <button class="btn solid" id="doReset" style="width:100%;text-align:center">Définir mon nouveau mot de passe</button>
    <div class="authmsg" id="rmsg"></div>
  </div>
</div></section>

<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 ELLIA PARIS</span><span><a href="mentions.html">Mentions légales</a> · <a href="cgv.html">CGV</a> · <a href="confidentialite.html">Confidentialité</a></span></div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js?v=24" defer></script>
<script src="cart.js?v=24" defer></script>
<script>
document.getElementById('go').addEventListener('click', async ()=>{
  const msg=document.getElementById('msg'); msg.className='authmsg'; msg.textContent='';
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  if(!email||!pw){ msg.className='authmsg err'; msg.textContent='Entre ton e-mail et ton mot de passe.'; return; }
  const { error } = await SB.auth.signInWithPassword({ email, password:pw });
  if(error){ msg.className='authmsg err'; msg.textContent="E-mail ou mot de passe incorrect (ou compte non confirmé)."; return; }
  location.href='compte.html';
});
document.getElementById('forgot').addEventListener('click', async (e)=>{
  e.preventDefault();
  const msg=document.getElementById('msg'); const email=document.getElementById('email').value.trim();
  if(!email){ msg.className='authmsg err'; msg.textContent='Entre d\'abord ton e-mail ci-dessus.'; return; }
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.origin+'/connexion.html' });
  msg.className = error?'authmsg err':'authmsg ok';
  msg.textContent = error? ('Erreur : '+error.message) : 'Si un compte existe, un e-mail de réinitialisation vient d\'être envoyé.';
});
/* Réinitialisation : quand l'utilisateur arrive via le lien reçu par e-mail */
SB.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){
    document.getElementById('resetBox').style.display='block';
    const m=document.getElementById('msg'); m.className='authmsg ok'; m.textContent='Choisissez votre nouveau mot de passe ci-dessous.';
    document.getElementById('newpw').focus();
  }
});
document.getElementById('doReset').addEventListener('click', async ()=>{
  const rmsg=document.getElementById('rmsg'); rmsg.className='authmsg'; rmsg.textContent='';
  const pw=document.getElementById('newpw').value;
  if(pw.length<8){ rmsg.className='authmsg err'; rmsg.textContent='8 caractères minimum.'; return; }
  const { error } = await SB.auth.updateUser({ password:pw });
  if(error){ rmsg.className='authmsg err'; rmsg.textContent='Erreur : '+error.message; return; }
  rmsg.className='authmsg ok'; rmsg.textContent='Mot de passe mis à jour ✓ Redirection…';
  setTimeout(()=>location.href='compte.html',1200);
});
</script>
</body>
</html>
