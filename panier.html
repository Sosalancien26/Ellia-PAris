<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panier — ELLIA PARIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
<style>
  .cart-wrap{max-width:980px;margin:0 auto;padding:0 40px}
  .cart-line{display:grid;grid-template-columns:1fr auto auto;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--ligne)}
  .cart-line .nm{font-family:var(--serif);font-size:22px}
  .cart-line .meta{font-size:13px;color:var(--gris-txt);margin-top:6px;letter-spacing:.02em}
  .cart-line .pr{font-family:var(--serif);font-size:20px}
  .cart-line .rm{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris-txt);cursor:pointer;background:none;border:none;border-bottom:1px solid var(--ligne);padding-bottom:2px}
  .cart-line .rm:hover{color:#b1432f}
  .cart-sum{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0;padding-top:24px}
  .cart-sum .l{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris-txt)}
  .cart-sum .v{font-family:var(--serif);font-size:40px}
  .empty{text-align:center;padding:40px 0}
  .empty p{color:var(--gris-txt);margin:14px 0 28px}
</style>
<meta name="description" content="Votre panier ELLIA PARIS — finalisez votre commande." />
<meta name="robots" content="noindex,nofollow" />
</head>
<body>
<div class="cursor"></div><div class="cursor-dot"></div>
<header id="header" class="solid">
  <div class="bar">
    <a href="index.html" aria-label="ELLIA PARIS"><img class="nav-logo" src="assets/logo_black_trim.png" alt="ELLIA PARIS" /></a>
    <nav class="links">
      <a href="index.html">Accueil</a><a href="pochette.html">La Pochette</a>
      <a href="personnalisation.html">Personnalisation</a><a href="maison.html">Maison</a>
    </nav>
    <div class="nav-right"><a href="compte.html" class="nav-ico account">Compte</a><a href="panier.html" class="nav-ico" data-cart-count>Panier (0)</a><button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button></div>
  </div>
</header>
<div class="mobile-menu" id="mobileMenu"><a href="index.html">Accueil</a><a href="pochette.html">La Pochette</a><a href="personnalisation.html">Personnalisation</a><a href="maison.html">Maison</a></div>

<section class="page-hero page-top"><div class="wrap"><div class="eyebrow">Votre sélection</div><h1>Panier</h1></div></section>

<section class="pad" style="padding-top:30px">
  <div class="cart-wrap">
    <div id="cartList"></div>
    <div id="cartFooter"></div>
  </div>
</section>
<script src="app.js?v=4"></script>
<script src="cart.js?v=4"></script>
<script>
(function(){
  const list=document.getElementById('cartList'), foot=document.getElementById('cartFooter');
  const eur=n=>n.toLocaleString('fr-FR')+' €';
  function persoTxt(it){
    if(!it.initiales) return 'Sans gravure';
    return 'Gravure : '+it.initiales+' · '+it.finition+' · '+it.emplacement;
  }
  function render(){
    const items=Cart.items();
    if(!items.length){
      list.innerHTML='<div class="empty"><p>Votre panier est vide.</p><a href="pochette.html" class="btn solid">Découvrir la pochette</a></div>';
      foot.innerHTML=''; return;
    }
    list.innerHTML=items.map((it,i)=>
      '<div class="cart-line"><div><div class="nm">'+(it.nom||'La Pochette Ellia')+'</div><div class="meta">'+persoTxt(it)+'</div></div>'+
      '<div class="pr">'+eur(it.prix)+'</div>'+
      '<button class="rm" data-i="'+i+'">Retirer</button></div>').join('');
    foot.innerHTML='<div class="cart-sum"><span class="l">Total</span><span class="v">'+eur(Cart.total())+'</span></div>'+
      '<div class="cta-row" style="justify-content:flex-end"><a href="pochette.html" class="btn">Continuer mes achats</a><a href="checkout.html" class="btn solid">Passer la commande</a></div>';
    list.querySelectorAll('.rm').forEach(b=>b.addEventListener('click',()=>{Cart.removeAt(Number(b.dataset.i));render();}));
  }
  render();
})();
</script>
</body>
</html>
