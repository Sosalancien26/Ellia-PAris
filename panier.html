<style>
  .cart-wrap{max-width:980px;margin:0 auto;padding:0 40px}
  .cart-line{display:grid;grid-template-columns:auto 1fr auto auto;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--ligne)}
  .cart-line .nm{font-family:var(--serif);font-size:22px}
  .cart-line .meta{font-size:13px;color:var(--gris-txt);margin-top:6px;letter-spacing:.02em}
  .cart-line .pr{font-family:var(--serif);font-size:20px}
  .cart-line .rm{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris-txt);cursor:pointer;background:none;border:none;border-bottom:1px solid var(--ligne);padding-bottom:2px}
  .cart-line .rm:hover{color:#b1432f}
  .cart-sum{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0;padding-top:24px}
  .cart-sum .l{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris-txt)}
  .cart-sum .v{font-family:var(--serif);font-size:40px}
  .empty{text-align:center;padding:40px 0}
  .empty p{color:var(--gris-txt);margin:14px 0 28px}

    <div id="cartFooter"></div>
  </div>

<script src="cart.js?v=1785400000" defer></script>
<script>
// On attend que cart.js (defer) soit charge avant d'utiliser Cart
document.addEventListener('DOMContentLoaded', function(){
(function(){
  const list=document.getElementById('cartList'), foot=document.getElementById('cartFooter');
  const eur=n=>(Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function persoTxt(it){
    if(!it.initiales && !(it.flame && it.flame.enabled)) return 'Sans gravure';
    var parts=[];
    if(it.initiales) {
      var ini='« '+esc(it.initiales)+' » · '+esc(it.finition||'')+' · '+esc(it.emplacement||'');
      if(it.fontScale && it.fontScale!==100) ini += ' · taille '+it.fontScale+'%';
      parts.push(ini);
    }
    if(it.flame && it.flame.enabled) {
      var symName = it.flame.symbol_name || 'Flamme';
      parts.push(esc(symName)+' : '+esc(it.flame.finish||'')+' · '+esc(it.flame.placement||''));
    }
    if(it.extra && it.extra.enabled) {
      parts.push(esc(it.extra.symbol_name||'—')+' : '+esc(it.extra.finish||'')+' · '+esc(it.extra.placement||''));
    }
    if(it.extra2 && it.extra2.enabled) {
      parts.push(esc(it.extra2.symbol_name||'—')+' : '+esc(it.extra2.finish||'')+' · '+esc(it.extra2.placement||''));
    }
    if(it.extra3 && it.extra3.enabled) {
      parts.push(esc(it.extra3.symbol_name||'—')+' : '+esc(it.extra3.finish||'')+' · '+esc(it.extra3.placement||''));
    }
    return 'Gravure : '+parts.join(' / ');
  }
  function previewImg(it){
    if(!it.preview) return '';
    return '<img src="'+it.preview+'" alt="Aperçu personnalisation" style="width:90px;height:90px;object-fit:cover;border:1px solid #e0ddd6;border-radius:3px;margin-right:18px;flex-shrink:0" />';
  }
  function render(){
    const items=Cart.items();
    if(!items.length){
      list.innerHTML='<div class="empty"><p>Votre panier est vide.</p><a href="pochette.html" class="btn solid">Découvrir la pochette</a></div>';
      foot.innerHTML=''; return;
    }
    list.innerHTML=items.map((it,i)=>
      '<div class="cart-line" style="align-items:center">'+previewImg(it)+
      '<div style="flex:1"><div class="nm">'+esc(it.nom||'La Pochette ELLIA')+'</div><div class="meta">'+persoTxt(it)+'</div></div>'+
      '<div class="pr">'+eur(it.prix)+'</div>'+
      '<button class="rm" data-i="'+i+'">Retirer</button></div>').join('');
    foot.innerHTML='<div class="cart-sum"><span class="l">Total</span><span class="v">'+eur(Cart.total())+'</span></div>'+
      '<div class="cta-row" style="justify-content:flex-end"><a href="pochette.html" class="btn">Continuer mes achats</a><a href="checkout.html" class="btn solid">Passer la commande</a></div>';
    list.querySelectorAll('.rm').forEach(b=>b.addEventListener('click',()=>{Cart.removeAt(Number(b.dataset.i));render();}));
  }
  render();
})();
}); // end DOMContentLoaded
</script>
